<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Administrador - DocenteTrack</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 login-body-bg">

  <div class="card login-card-container">
    <div class="card-body p-4 p-md-5 text-center">
      <h4 class="fw-bold mb-4">INICIO DE SESIÓN ADMINISTRADOR</h4>

      <div id="alertBox" class="alert d-none" role="alert"></div>

      <img src="../assets/logoB.jpg" alt="Logo del TecNM Tuxtla Gutiérrez" class="img-fluid mb-4 login-logo" loading="lazy">

      <form action="../php/login.php" method="POST" autocomplete="off" novalidate>
        <div class="mb-3 text-start">
          <label class="form-label login-label" for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" class="form-control login-input" placeholder="Ingresar usuario" required>
        </div>
      
        <div class="mb-3 text-start">
          <label class="form-label login-label" for="passwordInput">Contraseña</label>
          <div class="input-group">
            <input type="password" id="passwordInput" name="contrasena" class="form-control login-input-password" placeholder="Ingresar contraseña" required>
            <button class="btn btn-outline-secondary login-password-toggle" type="button" id="togglePassword">👁️</button>
          </div>
        </div>
      
        <div class="d-grid gap-3 mt-4">
          <button type="submit" class="btn btn-primary btn-tecnm-main">INGRESAR</button>
          <a href="../index.html" class="btn btn-light btn-tecnm-exit">Salir</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle contraseña
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePassword.textContent = isPassword ? '🙈' : '👁️';
    });

    // Mostrar mensajes de ?e= o ?ok=
    (function () {
      const params = new URLSearchParams(window.location.search);
      const box = document.getElementById('alertBox');
      const e  = params.get('e');   // error
      const ok = params.get('ok');  // info/éxito
      if (e) {
        box.className = 'alert alert-danger';
        box.textContent = e;
        box.classList.remove('d-none');
      } else if (ok) {
        box.className = 'alert alert-success';
        box.textContent = ok;
        box.classList.remove('d-none');
      }
    })();
  </script>
</body>
</html>
