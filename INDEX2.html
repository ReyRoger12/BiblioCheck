<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Alumnos - BiblioCheck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            background: url("assets/FONDOC.jpg") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-top: 5px solid #0d47a1;
            max-width: 400px;
            width: 100%;
        }
        .logo-bibliocheck {
            color: #0d47a1;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }
        .btn-primary {
            background-color: #0d47a1;
            border: none;
            padding: 10px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: #0b3d91;
            transform: translateY(-2px);
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ced4da;
        }
        .instrucciones {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <div class="logo-bibliocheck">
        <i class="fa-solid fa-book-bookmark"></i> BiblioCheck
    </div>
    
    <h5 class="mb-4">Generar mi acceso</h5>
    
    <form action="php/generar_qr_semanal.php" method="GET">
        <div class="mb-3 text-start">
            <label for="id_alumno" class="form-label small fw-bold">Número de identificador</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa fa-user"></i></span>
                <input type="text" 
                       class="form-control" 
                       id="id_alumno" 
                       name="id" 
                       placeholder="Ej. 10" 
                       required>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 mb-3">
            <i class="fa-solid fa-qrcode"></i> Obtener mi QR Vivo
        </button>
    </form>

    <div class="instrucciones border-top pt-3">
        <p><i class="fa-solid fa-location-dot text-danger"></i> <strong>Nota:</strong> Debes estar físicamente en la biblioteca y activar tu GPS para que el código sea válido.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
